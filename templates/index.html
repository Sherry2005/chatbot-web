<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            background: #faf9f7;
            color: #2a2a2a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 640px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            padding: 0 20px;
        }

        .header {
            text-align: center;
            padding: 28px 0 20px;
            border-bottom: 1px solid #e8e5e0;
            margin-bottom: 8px;
        }

        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 2rem;
            letter-spacing: 0.08em;
            color: #1a1a1a;
        }

        .header p {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #999;
            margin-top: 4px;
        }

        .personality-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 12px 0;
        }

        .persona-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 5px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: #888;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .persona-btn:hover {
            border-color: #aaa;
            color: #444;
        }

        .persona-btn.active {
            background: #2a2a2a;
            border-color: #2a2a2a;
            color: #fff;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: none;
        }

        #chat-box::-webkit-scrollbar { display: none; }

        .user-msg {
            display: flex;
            justify-content: flex-end;
        }

        .user-msg span {
            background: #2a2a2a;
            color: #fff;
            padding: 10px 16px;
            border-radius: 18px 18px 4px 18px;
            font-size: 0.88rem;
            line-height: 1.5;
            max-width: 75%;
        }

        .ai-msg {
            display: flex;
            justify-content: flex-start;
        }

        .ai-msg span {
            background: #fff;
            color: #2a2a2a;
            padding: 10px 16px;
            border-radius: 18px 18px 18px 4px;
            font-size: 0.88rem;
            line-height: 1.5;
            max-width: 75%;
            border: 1px solid #ede9e3;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        .typing {
            display: flex;
            justify-content: flex-start;
        }

        .typing span {
            background: #fff;
            border: 1px solid #ede9e3;
            padding: 10px 18px;
            border-radius: 18px 18px 18px 4px;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .dot {
            width: 5px;
            height: 5px;
            background: #bbb;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 0 24px;
            border-top: 1px solid #e8e5e0;
        }

        #user-input {
            flex: 1;
            background: none;
            border: none;
            border-bottom: 1px solid #ddd;
            padding: 8px 0;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 300;
            color: #2a2a2a;
            outline: none;
            transition: border-color 0.2s;
        }

        #user-input::placeholder { color: #bbb; }
        #user-input:focus { border-bottom-color: #2a2a2a; }

        #send-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #bbb;
            font-size: 1.2rem;
            transition: color 0.2s;
            padding: 4px;
        }

        #send-btn:hover { color: #2a2a2a; }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Chatbot</h1>
            <p>Powered by Llama</p>
        </div>

        <div class="personality-bar">
            <button class="persona-btn active" onclick="switchPersonality('sarcastic', this)">😏 Sarcastic</button>
            <button class="persona-btn" onclick="switchPersonality('friendly', this)">😊 Friendly</button>
            <button class="persona-btn" onclick="switchPersonality('professional', this)">💼 Professional</button>
        </div>

        <div id="chat-box"></div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Write a message..." />
            <button id="send-btn" onclick="sendMessage()">→</button>
        </div>
    </div>

    <script>
        async function loadHistory() {
            const response = await fetch('/history');
            const data = await response.json();
            data.messages.forEach(msg => {
                if (msg.role === 'user') addMessage(msg.content, 'user');
                if (msg.role === 'assistant') addMessage(msg.content, 'ai');
            });
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';
            showTyping();

            const response = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: message})
            });

            removeTyping();
            const data = await response.json();
            addMessage(data.reply, 'ai');
        }

        async function switchPersonality(persona, btn) {
            document.querySelectorAll('.persona-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            await fetch('/switch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({personality: persona})
            });
            document.getElementById('chat-box').innerHTML = '';
        }

        function showTyping() {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typing-indicator';
            div.innerHTML = `<span><div class="dot"></div><div class="dot"></div><div class="dot"></div></span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = sender === 'user' ? 'user-msg fade-in' : 'ai-msg fade-in';
            div.innerHTML = `<span>${text}</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        loadHistory();
    </script>
</body>
</html>
